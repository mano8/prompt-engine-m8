name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install lint tools
        run: pip install ruff==0.15.18

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r promt_engine_service/requirements_dev.txt

      - name: Type check promt_engine_service
        run: mypy promt_engine_service --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (grade A - no MEDIUM/HIGH issues)
        run: bandit -r promt_engine_service -x promt_engine_service/alembic --severity-level medium -f json -o bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Install pip-audit
        run: pip install pip-audit

      # Audits the dev toolchain (ruff, mypy, bandit, pytest, build tools).
      # These are floors, so this resolves whatever is current on the day CI
      # runs - which is the right question for tooling and the wrong one for
      # the artifact. The step below asks the artifact question.
      - name: Run pip-audit (dev toolchain)
        run: pip-audit -r promt_engine_service/requirements_dev.txt

      # Audits the set the release image actually installs.
      #
      # requirements_dev.txt is `-r requirements_base.txt` plus dev tools, and
      # every entry is a `>=` floor, so auditing it resolves a graph that is
      # not the one that ships. Measured against this lock: of the 49 pins the
      # image installs, 20 are audited at a *newer* version than the one
      # shipped (starlette 1.3.1 vs 1.6.0, uvicorn 0.49.0 vs 0.52.4, alembic
      # 1.18.5 vs 1.19.1, ...), and gunicorn - the production server, declared
      # in requirements_prod.txt and in no dev file - is not audited at all.
      # A CVE against a shipped version that is fixed in a newer one is
      # therefore invisible to the dev audit: it resolves the fixed version
      # and reports clean while the image ships the vulnerable one.
      #
      # trivy-image scans the built image and so does cover this set, but only
      # at CRITICAL/HIGH with ignore-unfixed, and only once the image builds.
      # pip-audit has no severity floor and reads the lock as source, which is
      # where a fix has to land anyway.
      #
      # The lock is fully pinned and hashed for linux, so this needs no
      # --no-deps: pip resolves it exactly as the Dockerfile's
      # `--require-hashes` install does.
      - name: Run pip-audit (shipped prod lock)
        run: pip-audit -r promt_engine_service/requirements_prod.lock

      - name: Trivy filesystem scan (CRITICAL/HIGH CVEs and secrets)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: promt_engine_service/requirements_dev.txt

      - name: Install dependencies
        run: pip install -r promt_engine_service/requirements_dev.txt

      - name: Run tests
        run: pytest --cov-report=xml --cov-fail-under=100

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          verbose: true

      - name: Upload coverage to Codacy
        if: matrix.python-version == '3.12' && github.actor != 'dependabot[bot]'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image for scanning (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: promt_engine_service/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: prompt-engine-m8:ci-scan
          cache-from: type=gha

      - name: Trivy image scan (CRITICAL/HIGH CVEs - blocks PR on findings)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: image
          image-ref: prompt-engine-m8:ci-scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
